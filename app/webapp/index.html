<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gift Track</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0e0e10; --card:#1a1a1e; --gold:#e5c44a; --text:#fff; --muted:#8d8d96; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px 16px 40px; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  h2 { font-size:12px; letter-spacing:.08em; color:var(--muted); margin:24px 0 10px; text-transform:uppercase; }
  .card { display:flex; gap:14px; align-items:center; background:var(--card); border-radius:16px; padding:14px; margin-bottom:10px; }
  .ico { width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center;
         background:radial-gradient(circle at 30% 30%, #f3dd7a, #b8941f); font-size:20px; }
  .card b { display:block; font-size:16px; } .card span { color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input[type=text], input[type=number] { width:100%; padding:12px; border-radius:12px; border:1px solid #2b2b31;
         background:var(--card); color:var(--text); font-size:15px; }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  button { width:100%; margin-top:14px; padding:14px; border:0; border-radius:14px; font-size:16px; font-weight:600;
           background:linear-gradient(135deg,#f3dd7a,#c9a227); color:#1a1400; }
  button.alt { background:var(--card); color:var(--gold); border:1px solid #3a3320; }
  .status { padding:12px 14px; border-radius:14px; background:var(--card); font-size:14px; }
  .on { color:#6fdc8c; } .off { color:#ff7b7b; }
  .sw { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
</style>
</head>
<body>
<h2>Преимущества</h2>
<div class="card"><div class="ico">⚡</div><div><b>Моментальные листинги</b><span>Уведомления сразу после улучшения</span></div></div>
<div class="card"><div class="ico">🔍</div><div><b>Точный поиск владельца</b><span>Показываем ссылку на владельца подарка</span></div></div>
<div class="card"><div class="ico">★</div><div><b>Полное сопровождение</b><span>Помощь со сделками и инвайт в закрытый чат</span></div></div>

<h2>Подписка</h2>
<div class="status" id="status">Загрузка…</div>
<div id="plans"></div>

<h2>Фильтры</h2>
<div class="sw"><span>Уведомления включены</span><input type="checkbox" id="enabled" checked></div>
<label>Коллекции (через запятую, пусто = все)</label>
<input type="text" id="collections" placeholder="Plush Pepe, Heart Locket">
<label>Модели</label>
<input type="text" id="models" placeholder="часть названия">
<label>Фоны</label>
<input type="text" id="backdrops" placeholder="Black, Onyx Black">
<div class="row">
  <div><label>Цена от (⭐)</label><input type="number" id="price_min" inputmode="numeric"></div>
  <div><label>Цена до (⭐)</label><input type="number" id="price_max" inputmode="numeric"></div>
</div>
<button id="save">Сохранить фильтры</button>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const H = { "Content-Type":"application/json", "X-Init-Data": tg.initData };
const $ = id => document.getElementById(id);

async function api(path, body) {
  const r = await fetch(path, body ? { method:"POST", headers:H, body:JSON.stringify(body) } : { headers:H });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  const me = await api("/api/me");
  $("status").innerHTML = me.active
    ? '<span class="on">● Подписка активна</span> до ' + new Date(me.sub_until).toLocaleString()
    : '<span class="off">● Подписки нет</span> — оформи, чтобы получать уведомления';
  $("plans").innerHTML = "";
  Object.entries(me.plans).forEach(([days, price]) => {
    const b = document.createElement("button"); b.className = "alt";
    b.textContent = days + " дн. — " + price + " ⭐";
    b.onclick = async () => {
      const { link } = await api("/api/invoice", { days: +days });
      tg.openInvoice(link, s => { if (s === "paid") load(); });
    };
    $("plans").appendChild(b);
  });
  $("enabled").checked = me.enabled;
  $("collections").value = me.collections.join(", ");
  $("models").value = me.models.join(", ");
  $("backdrops").value = me.backdrops.join(", ");
  $("price_min").value = me.price_min ?? "";
  $("price_max").value = me.price_max ?? "";
}

$("save").onclick = async () => {
  await api("/api/filters", {
    enabled: $("enabled").checked,
    collections: $("collections").value, models: $("models").value, backdrops: $("backdrops").value,
    price_min: $("price_min").value, price_max: $("price_max").value,
  });
  tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
  tg.showAlert("Фильтры сохранены");
};

load().catch(() => { $("status").textContent = "Открой приложение из бота"; });
</script>
</body>
</html>
